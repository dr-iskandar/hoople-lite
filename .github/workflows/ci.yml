name: Verify Hoople lite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: hoople_lite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hoople_lite_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test logic
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install API dependencies
        run: npm ci --prefix apps/api
      - name: Typecheck and build backend
        run: npm run api:build
      - name: Provision ephemeral PostgreSQL and run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/hoople_lite_ci
          CI: 'true'
        run: npm run db:setup:ci
      - name: Test API (including PostgreSQL tenant isolation)
        env:
          API_TEST_DATABASE_URL: postgresql://hoople_api:ci-only-password@localhost:5432/hoople_lite_ci
        run: npm run api:test
